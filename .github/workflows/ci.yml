name: CI

# Build, test, and lint on every PR and on pushes to main. The `verify` job is
# the required status check for the protected `main` branch.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # keytar's native binding dlopens libsecret on Linux even though the tests
      # mock keytar, so it must be present on the runner.
      - name: Install libsecret (keytar runtime dependency)
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-0

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint
