name: Publish to npm

# Publishes the package to npm whenever a GitHub Release is published.
#
# Setup (one-time):
#   1. Create an npm "Automation" access token (npmjs.com → Access Tokens).
#   2. Add it as a repository secret named NPM_TOKEN
#      (Settings → Secrets and variables → Actions → New repository secret).
#
# Then: create a Release (the tag, e.g. v1.2.3, must match package.json "version").

on:
  release:
    types: [published]
  workflow_dispatch: {} # allow a manual publish of the current package.json version

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: npm

      # keytar's native binding loads libsecret on Linux; the test suite mocks
      # keytar but jest's automock still dlopens the real module, which needs
      # libsecret-1.so.0 present on the runner.
      - name: Install libsecret (keytar Linux runtime dependency)
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-0

      - name: Install dependencies
        run: npm ci

      - name: Verify release tag matches package.json version
        if: github.event_name == 'release'
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          TAG="${GITHUB_REF_NAME}"
          echo "package.json: $PKG_VERSION   release tag: $TAG"
          if [ "$PKG_VERSION" != "$TAG" ]; then
            echo "::error::Release tag ($TAG) does not match package.json version ($PKG_VERSION)."
            exit 1
          fi

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Publish to npm
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
