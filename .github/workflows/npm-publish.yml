name: Publish to npm

# Publishes the package to npm whenever a GitHub Release is published.
#
# Auth: npm Trusted Publishing (OIDC) — NO stored token. One-time setup on npm:
#   npmjs.com → package "jsicloud" → Settings → Trusted Publisher → add:
#     Publisher = GitHub Actions
#     Organization/user = zeynalnia
#     Repository        = icloudjs
#     Workflow filename = npm-publish.yml
# After configuring it there, you can delete the NPM_TOKEN repo secret.
#
# Create a Release whose tag (e.g. v1.2.3) matches package.json "version".

on:
  release:
    types: [published]
  workflow_dispatch: {} # allow a manual publish of the current package.json version

permissions:
  contents: read
  id-token: write # required for npm Trusted Publishing (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: npm

      # Trusted Publishing (OIDC) requires npm >= 11.5.1; the runner ships 10.x.
      - name: Upgrade npm (OIDC support)
        run: npm install -g npm@latest

      # keytar's native binding loads libsecret on Linux; the test suite mocks
      # keytar but jest's automock still dlopens the real module, which needs
      # libsecret-1.so.0 present on the runner.
      - name: Install libsecret (keytar Linux runtime dependency)
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-0

      - name: Install dependencies
        run: npm ci

      - name: Verify release tag matches package.json version
        if: github.event_name == 'release'
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          TAG="${GITHUB_REF_NAME}"
          echo "package.json: $PKG_VERSION   release tag: $TAG"
          if [ "$PKG_VERSION" != "$TAG" ]; then
            echo "::error::Release tag ($TAG) does not match package.json version ($PKG_VERSION)."
            exit 1
          fi

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

      # No NODE_AUTH_TOKEN: npm authenticates via the GitHub OIDC token against
      # the trusted publisher configured on npm. Provenance is ENABLED (the repo
      # is public): npm attaches a signed provenance attestation linking the
      # published tarball to this workflow run and commit.
      - name: Publish to npm (Trusted Publishing + provenance)
        run: npm publish
        env:
          NPM_CONFIG_PROVENANCE: true
